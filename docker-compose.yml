services:
  music-api:
    build: ./api
    container_name: music-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app
      - ${MUSIC_LOCAL_PATH:-/tmp/music}:${MUSIC_LOCAL_PATH:-/tmp/music}:ro

  music-front:
    build: ./front
    container_name: music-front
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - music-api
